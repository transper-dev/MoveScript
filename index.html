<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <title>MoveScript VR</title>
  <link rel="icon" type="image/png" href="./icons/icon.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
  <script>
    const agente = navigator.userAgent;
    if (agente.includes("OculusBrowser") || agente.includes("Quest")) {
      window.location.href = "/visor.html";
    }
  </script>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    #app {
      height: 100%;
      width: 100%;
      position: relative;
    }

    #preview {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      background: #000;
      z-index: 0;
    }

    /* BARRA DEL EDITOR IZQUIERDO */
    #overlay {
      position: fixed;
      top: 16px;
      left: 16px;
      width: min(475px, calc(100vw - 32px));
      height: min(220px, calc(100vh - 32px));
      display: flex;
      flex-direction: column;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
    }

    #bar {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
      background: transparent;
      user-select: none;
      overflow-x: auto;
      scrollbar-width: none;
      cursor: grab;
    }

    #bar:active {
      cursor: grabbing;
    }

    #bar::-webkit-scrollbar {
      display: none;
    }

    #run,
    #toggle,
    #randomBtn,
    #globalPauseBtn,
    #saveBtn,
    #docsBtn {
      padding: 6px 10px;
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.06);
      color: #eaeaea;
      transition: all 0.3s ease;
    }

    #run:hover,
    #toggle:hover,
    #randomBtn:hover,
    #globalPauseBtn:hover,
    #saveBtn:hover,
    #docsBtn:hover {
      background: rgba(255, 255, 255, 0.10);
    }

    .btn-save.saved {
      background-color: #00ffcc !important;
      color: #000 !important;
      border-color: #00ffcc !important;
      font-weight: bold;
    }

    /* --- ESTILOS DE CODEMIRROR SOBREESCRITOS --- */
    .CodeMirror {
      flex: 1;
      width: 100%;
      height: 100%;
      box-sizing: border-box !important;
      max-width: 100%;
      min-width: 0;
      background: transparent !important;
      color: #e8e8e8;
      font: 14px/1.45 Consolas, monospace;
      text-shadow: 0 0 4px black;
      padding: 12px;
    }

    .CodeMirror-wrap pre.CodeMirror-line,
    .CodeMirror-wrap pre.CodeMirror-line-like {
      word-break: break-all !important;
    }

    .CodeMirror-gutters {
      background: transparent !important;
      border-right: none !important;
    }

    .flash-line {
      background-color: rgba(0, 255, 204, 0.4) !important;
      transition: background-color 0.4s ease-out;
    }

    .chain-active-text {
      background-color: rgba(0, 255, 204, 0.3) !important;
      border-radius: 3px;
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
    }

    .color-widget {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 3px;
      margin-right: 4px;
      vertical-align: middle;
      box-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
    }

    #overlay.minimized {
      min-height: 0;
    }

    #overlay.minimized .CodeMirror,
    #overlay.minimized #resizeHandle {
      display: none;
    }

    #overlay {
      min-width: 475px;
      min-height: 220px;
      max-width: calc(100vw - 16px);
      max-height: calc(100vh - 16px);
      pointer-events: none;
    }

    #bar,
    .CodeMirror,
    #resizeHandle {
      pointer-events: auto;
    }

    #resizeHandle {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 14px;
      height: 14px;
      cursor: nwse-resize;
      border-right: 2px solid rgba(255, 255, 255, 0.35);
      border-bottom: 2px solid rgba(255, 255, 255, 0.35);
      opacity: 0.9;
    }

    #loader {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00ffff;
      font-family: Consolas, monospace;
      font-size: 24px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px 30px;
      border-radius: 8px;
      border: 1px solid #00ffff;
      display: none;
      pointer-events: none;
      z-index: 9999;
    }

    #bvh-drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(10px);
      color: white;
      z-index: 1000;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      font-family: sans-serif;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 20px;
    }

    #bvh-drawer.abierto {
      transform: translateY(0);
    }

    #drawer-toggle {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 30px;
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: none;
      border-radius: 10px 10px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #aaaaaa;
      transition: all 0.2s;
    }

    #drawer-toggle:hover {
      color: #00ffcc;
      background: rgba(30, 30, 30, 0.9);
    }

    .drawer-header {
      padding: 10px 20px;
      font-size: 14px;
      color: #aaaaaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .drawer-carousel {
      display: flex;
      align-items: flex-start;
      padding: 10px 20px 20px 20px;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: #555 transparent;
    }

    .bvh-item {
      flex: 0 0 auto;
      width: 160px;
      height: 90px;
      background: #222;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
      user-select: none;
      padding: 10px;
      box-sizing: border-box;
      text-align: center;
    }

    .bvh-item:hover {
      background: #333;
      transform: scale(1.05);
    }

    .bvh-item span {
      font-size: 14px;
      font-weight: bold;
      pointer-events: none;
      width: 100%;
      overflow-wrap: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* --- SISTEMA DE ERRORES VISUALES --- */
    #error-toast {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(255, 40, 40, 0.9);
      backdrop-filter: blur(5px);
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      border-left: 5px solid #ffaaaa;
      font-family: Consolas, monospace;
      font-size: 13px;
      z-index: 9999;
      max-width: 400px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      transform: translateX(120%);
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      pointer-events: none;
    }

    #error-toast.visible {
      transform: translateX(0);
    }

    #error-toast strong {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* --- SIDEBAR AYUDA --- */
    #help-sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: 280px;
      height: 100vh;
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(10px);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      color: #ddd;
      z-index: 1000;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      display: flex;
      flex-direction: column;
      font-family: Consolas, monospace;
    }

    #help-sidebar.abierto {
      transform: translateX(0);
    }

    #help-toggle {
      position: absolute;
      top: 20px;
      left: -40px;
      width: 40px;
      height: 40px;
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-right: none;
      border-radius: 10px 0 0 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #00ffcc;
      font-size: 18px;
      font-weight: bold;
      transition: all 0.2s;
    }

    #help-toggle:hover {
      color: #fff;
      background: rgba(0, 255, 204, 0.2);
    }

    .help-content {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      scrollbar-width: thin;
      scrollbar-color: #555 transparent;
    }

    .help-category {
      color: #aaaaaa;
      font-size: 11px;
      text-transform: uppercase;
      margin-top: 25px;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 5px;
      font-family: sans-serif;
      letter-spacing: 1px;
    }

    .help-category:first-child {
      margin-top: 0;
    }

    .help-item {
      margin-bottom: 14px;
      cursor: pointer;
      transition: transform 0.1s;
      user-select: none;
    }

    .help-item:hover {
      transform: translateX(5px);
    }

    .help-cmd {
      font-weight: bold;
      color: #fff;
      font-size: 13px;
      transition: color 0.2s;
    }

    .help-item:hover .help-cmd {
      color: #00ffcc;
    }

    .help-desc {
      font-size: 11px;
      color: #888;
      display: block;
      margin-top: 3px;
      font-family: sans-serif;
    }

    /* --- GRUPOS LOCALES / GLOBALES --- */
    .bvh-category-group {
      display: flex;
      flex-direction: column;
      margin-right: 25px;
    }

    .bvh-category-header {
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
      padding-left: 19px;
    }

    .bvh-category-items {
      display: flex;
      gap: 15px;
      border-left: 4px solid;
      padding-left: 15px;
      border-radius: 2px;
    }

    .group-global .bvh-category-header {
      color: #00ffcc;
    }

    .group-global .bvh-category-items {
      border-color: #00ffcc;
    }

    .bvh-item.bvh-global:hover {
      border-color: #00ffcc;
    }

    /* --- TEMA LOCALES (Naranja) --- */
    .group-local .bvh-category-header {
      color: #ffaa00;
    }

    .group-local .bvh-category-items {
      border-color: #ffaa00;
    }

    .bvh-item.bvh-local:hover {
      border-color: #ffaa00;
    }

    .btn-add-local {
      border: 2px dashed rgba(255, 170, 0, 0.5) !important;
      background: transparent;
      flex-direction: column;
    }

    .btn-add-local:hover {
      border-color: #ffaa00 !important;
      background: rgba(255, 170, 0, 0.1) !important;
    }

    .btn-add-local span {
      color: #ffaa00 !important;
    }

    .bvh-item.selected-bvh {
      transform: scale(1.05);
    }

    .bvh-item.selected-bvh span {
      display: none;
    }

    .bvh-item.selected-bvh::after {
      content: "➕ ADD";
      font-weight: bold;
      font-size: 16px;
      letter-spacing: 1px;
    }

    .bvh-item.bvh-global.selected-bvh {
      background: rgba(0, 255, 204, 0.15);
      border-color: #00ffcc;
    }

    .bvh-item.bvh-global.selected-bvh::after {
      color: #00ffcc;
    }

    .bvh-item.bvh-local.selected-bvh {
      background: rgba(255, 170, 0, 0.15);
      border-color: #ffaa00;
    }

    .bvh-item.bvh-local.selected-bvh::after {
      color: #ffaa00;
    }
  </style>
</head>

<body>
  <div id="loader">Loading...</div>

  <div id="app">
    <iframe id="preview" src="http://localhost:3000/visor.html" sandbox="allow-scripts allow-same-origin"
      allow="xr-spatial-tracking"></iframe>
    <div id="overlay">
      <div id="bar">
        <button id="saveBtn" class="btn-save">Save (Ctrl+S)</button>
        <button id="run">Run (Ctrl+Enter)</button>
        <button id="toggle">Hide (Esc)</button>
        <button id="globalPauseBtn">Pause (Ctrl+P)</button>
        <button id="docsBtn">Docs <i class="fas fa-external-link-alt"
            style="font-size: 0.8em; margin-left: 5px;"></i></button>
        <button id="randomBtn" style="display: none;"><i class="fas fa-random"></i> Random</button>
      </div>
      <textarea id="code" spellcheck="false"></textarea>
      <div id="resizeHandle"></div>
    </div>
  </div>

  <div id="help-sidebar">
    <div id="help-toggle">?</div>
    <div class="help-content">
      <div class="help-category">Creators (Block Start)</div>
      <div class="help-item" data-insert='[bvh("dummy")]'><span class="help-cmd">[bvh("dummy")]</span><span
          class="help-desc">Creates a T-pose skeleton</span></div>
      <div class="help-category">Modifiers</div>
      <div class="help-item" data-insert='.joints(1.5)'><span class="help-cmd">.joints(s)</span><span
          class="help-desc">Joint size</span></div>
      <div class="help-item" data-insert='.bones(2, 1)'><span class="help-cmd">.bones(w, [l])</span><span
          class="help-desc">Bone thickness and length</span></div>
      <div class="help-item" data-insert='.color("red", "blue")'><span class="help-cmd">.color(c1, [c2])</span><span
          class="help-desc">Color or gradient</span></div>
    </div>
  </div>

  <div id="bvh-drawer">
    <div id="drawer-toggle"><i class="fas fa-chevron-up"></i></div>
    <div class="drawer-header"><span>Movement Previews</span></div>
    <div class="drawer-carousel" id="bvh-list"></div>
  </div>

  <div id="error-toast">
    <strong>Error de Sintaxis</strong>
    <span id="error-text"></span>
  </div>

  <script src="http://localhost:3000/socket.io/socket.io.js"></script>
  <script>
    window.socket = io('http://localhost:3000');
  </script>
  <script type="module" src="./main.js"></script>

  <script type="module">
    document.addEventListener("DOMContentLoaded", async () => {
      const drawer = document.getElementById('bvh-drawer');
      const toggleBtn = document.getElementById('drawer-toggle');
      const toggleIcon = toggleBtn.querySelector('i');
      const bvhList = document.getElementById('bvh-list');
      const iframePreview = document.getElementById('preview');
      const docsBtn = document.getElementById('docsBtn');
      if (docsBtn) {
        docsBtn.addEventListener('click', () => {
          window.open('docs.html', '_blank');
        });
      }

      // --- ACTIVAR LA INTERFAZ ---
      toggleBtn.addEventListener('click', () => {
        drawer.classList.toggle('abierto');
        toggleIcon.className = drawer.classList.contains('abierto') ? 'fas fa-chevron-down' : 'fas fa-chevron-up';
      });

      const helpSidebar = document.getElementById('help-sidebar');
      const helpToggle = document.getElementById('help-toggle');
      helpToggle.addEventListener('click', () => {
        helpSidebar.classList.toggle('abierto');
        helpToggle.textContent = helpSidebar.classList.contains('abierto') ? 'X' : '?';
      });

      document.querySelectorAll('.help-item').forEach(item => {
        item.addEventListener('click', () => {
          if (!window.editor) return;
          const insertText = item.getAttribute('data-insert');
          if (insertText.startsWith('[')) {
            let code = window.editor.getValue();
            const regexBusqueda = /\[[^\]]+\]/;
            if (regexBusqueda.test(code)) {
              code = code.replace(regexBusqueda, `${insertText}\n>$&`);
            } else {
              code += `${code.trim() !== "" ? "\n\n" : ""}${insertText}`;
            }
            window.editor.setValue(code);
            if (iframePreview.contentWindow) document.getElementById('run').click();
          } else {
            window.editor.replaceSelection(insertText);
          }
          window.editor.focus();
        });
      });

      // --- CARGA DE DATOS  ---
      let animacionesDisponibles = [];
      let animacionesLocales = new Set();
      let customBvhPath = "";

      try {
        if (window.require) {
          const fs = window.require('fs');
          const path = window.require('path');

          const isDev = window.process.execPath.toLowerCase().includes('electron.exe');
          const basePath = isDev ? window.process.cwd() : path.dirname(window.process.execPath);

          // LEER GLOBALES
          const rutaGlobal = isDev
            ? path.join(window.process.cwd(), 'assets', 'bvh')
            : path.join(window.process.resourcesPath, 'app.asar', 'assets', 'bvh');

          if (fs.existsSync(rutaGlobal)) {
            const archivosGlobales = fs.readdirSync(rutaGlobal);
            archivosGlobales.filter(a => a.endsWith('.bvh')).forEach(a => {
              animacionesDisponibles.push(a.replace('.bvh', ''));
            });
          }

          // LEER LOCALES
          customBvhPath = path.join(basePath, 'MoveScript_BVH');
          if (!fs.existsSync(customBvhPath)) {
            fs.mkdirSync(customBvhPath, { recursive: true });
          } else {
            const archivosCustom = fs.readdirSync(customBvhPath);
            archivosCustom.filter(a => a.endsWith('.bvh')).forEach(a => {
              const nombre = a.replace('.bvh', '');
              if (!animacionesDisponibles.includes(nombre)) {
                animacionesDisponibles.push(nombre);
                animacionesLocales.add(nombre);
              }
            });
          }
        }
      } catch (e) {
        console.warn("Error leyendo las carpetas nativamente:", e);
      }

      if (animacionesDisponibles.length === 0) {
        animacionesDisponibles = ["surprise", "posing", "pendulum", "froging"];
      }

      animacionesDisponibles = animacionesDisponibles.filter(nombre => nombre !== 'dummy');

      let botonActivo = null;

      function crearBotonAnimacion(nombre, esLocal = false) {
        const btn = document.createElement('div');
        btn.className = 'bvh-item' + (esLocal ? ' bvh-local' : ' bvh-global');
        btn.innerHTML = `<span>${nombre}</span>`;

        btn.addEventListener('click', () => {
          if (botonActivo === btn) {
            if (!window.editor) return;
            let currentCode = window.editor.getValue().trim();
            if (currentCode.endsWith(';')) currentCode = currentCode.slice(0, -1);

            const insertText = `[bvh("${nombre}")]`;
            let salto = currentCode !== "" ? (currentCode.endsWith(']') ? ">\n" : "\n") : "";

            window.editor.setValue(currentCode + salto + insertText);

            for (let i = 0; i < window.editor.lineCount(); i++) {
              let textoLinea = window.editor.getLine(i);
              let posicion = textoLinea.lastIndexOf(insertText);
              if (posicion !== -1) {
                window.editor.setCursor({ line: i, ch: posicion + insertText.length - 1 });
                break;
              }
            }
            window.editor.focus();
            if (iframePreview.contentWindow) document.getElementById('run').click();

            btn.classList.remove('selected-bvh');
            botonActivo = null;
          } else {
            if (botonActivo) botonActivo.classList.remove('selected-bvh');
            btn.classList.add('selected-bvh');
            botonActivo = btn;

            if (iframePreview.contentWindow) {
              if (window.editor) window.editor.getAllMarks().forEach(m => m.clear());
              let currentCode = window.editor ? window.editor.getValue() : "";
              let comandosEntorno = (currentCode.match(/(?:bg|background|floor|cam|grid)\s*\([^)]*\)/g) || []).join("; ");

              const previewCode = `
                clear(); 
                cam(0, 150, 350, 0, 100, 0); 
                bg("#0a0a0a"); 
                ${comandosEntorno}; 
                CHAIN($B()._setIdx(-1).bvh("${nombre}"));
              `;
              iframePreview.contentWindow.postMessage({ type: 'execute', code: previewCode }, '*');
            }
          }
        });
        return btn;
      }

      let addBtn = null;
      try {
        if (window.require) {
          const fs = window.require('fs');
          const path = window.require('path');

          addBtn = document.createElement('div');
          addBtn.className = 'bvh-item btn-add-local';
          addBtn.innerHTML = `
            <span style="font-size: 24px; pointer-events: none;">+</span>
            <span style="font-size: 12px; pointer-events: none; margin-top: 5px;">NEW BVH</span>
          `;

          const fileInput = document.createElement('input');
          fileInput.type = 'file';
          fileInput.accept = '.bvh';
          fileInput.style.display = 'none';
          addBtn.appendChild(fileInput);

          addBtn.addEventListener('click', () => fileInput.click());

          fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
              const destPath = path.join(customBvhPath, file.name);
              const arrayBuffer = await file.arrayBuffer();
              const buffer = window.require('buffer').Buffer.from(arrayBuffer);
              fs.writeFileSync(destPath, buffer);

              const nombreAnimacion = path.parse(file.name).name;
              const existe = animacionesDisponibles.includes(nombreAnimacion);

              if (!existe) {
                animacionesLocales.add(nombreAnimacion);
                animacionesDisponibles.push(nombreAnimacion);
                renderizarLista();
              }
              fileInput.value = '';

            } catch (err) {
              alert("Error al intentar guardar: " + err.message);
              console.error(err);
            }
          });
        }
      } catch (e) {
        console.warn("Botón ADD local desactivado.", e);
      }

      function renderizarLista() {
        bvhList.innerHTML = '';

        const locales = animacionesDisponibles
          .filter(n => animacionesLocales.has(n))
          .sort((a, b) => a.localeCompare(b));

        const globales = animacionesDisponibles
          .filter(n => !animacionesLocales.has(n))
          .sort((a, b) => a.localeCompare(b));

        // --- SECCIÓN GLOBALES ---
        if (globales.length > 0) {
          const grupoGlobales = document.createElement('div');
          grupoGlobales.className = 'bvh-category-group group-global';

          const tituloGlobales = document.createElement('div');
          tituloGlobales.className = 'bvh-category-header';
          tituloGlobales.innerText = 'Global';
          grupoGlobales.appendChild(tituloGlobales);

          const itemsGlobales = document.createElement('div');
          itemsGlobales.className = 'bvh-category-items';

          globales.forEach(nombre => {
            itemsGlobales.appendChild(crearBotonAnimacion(nombre, false));
          });

          grupoGlobales.appendChild(itemsGlobales);
          bvhList.appendChild(grupoGlobales);
        }

        // --- SECCIÓN LOCALES ---
        const grupoLocales = document.createElement('div');
        grupoLocales.className = 'bvh-category-group group-local';

        const tituloLocales = document.createElement('div');
        tituloLocales.className = 'bvh-category-header';
        tituloLocales.innerText = 'Local';
        grupoLocales.appendChild(tituloLocales);

        const itemsLocales = document.createElement('div');
        itemsLocales.className = 'bvh-category-items';

        locales.forEach(nombre => {
          itemsLocales.appendChild(crearBotonAnimacion(nombre, true));
        });

        if (addBtn) {
          itemsLocales.appendChild(addBtn);
        }

        grupoLocales.appendChild(itemsLocales);
        bvhList.appendChild(grupoLocales);
      }

      // Renderizado inicial
      renderizarLista();
    });
  </script>
</body>

</html>
