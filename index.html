<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <title>MoveScript</title>
  <link rel="icon" type="image/png" href="./icons/icon.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    #app {
      height: 100%;
      width: 100%;
      position: relative;
    }

    #preview {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      background: #000;
      z-index: 0;
    }

    /* --- CONTENEDOR DE SANDBOXES (no intercepta el ratón; cada sandbox sí) --- */
    #sandboxes {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    /* --- UN SANDBOX (EDITOR FLOTANTE) --- */
    .sandbox {
      position: fixed;
      top: 16px;
      left: 16px;
      width: min(475px, calc(100vw - 32px));
      height: min(220px, calc(100vh - 32px));
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      min-width: 475px;
      min-height: 220px;
      max-width: calc(100vw - 16px);
      max-height: calc(100vh - 16px);
      pointer-events: none;
    }

    .sandbox.active {
      border-color: rgba(0, 255, 204, 0.55);
    }

    .sandbox.minimized {
      min-height: 0;
    }

    .sandbox.minimized .CodeMirror,
    .sandbox.minimized .sb-resize {
      display: none;
    }

    .sb-bar,
    .sandbox .CodeMirror,
    .sb-resize {
      pointer-events: auto;
    }

    .sb-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
      background: transparent;
      user-select: none;
      overflow-x: auto;
      scrollbar-width: none;
      cursor: grab;
    }

    .sb-bar:active {
      cursor: grabbing;
    }

    .sb-bar::-webkit-scrollbar {
      display: none;
    }

    .sb-title {
      color: #00ffcc;
      font: bold 12px sans-serif;
      letter-spacing: 1px;
      white-space: nowrap;
      padding-right: 4px;
    }

    .sb-btn,
    .global-btn {
      padding: 6px 10px;
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.06);
      color: #eaeaea;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .sb-btn:hover,
    .global-btn:hover {
      background: rgba(255, 255, 255, 0.10);
    }

    .sb-btn.saved {
      background-color: #00ffcc !important;
      color: #000 !important;
      border-color: #00ffcc !important;
      font-weight: bold;
    }

    /* botones solo-icono de la barra de cada sandbox */
    .sb-icon {
      min-width: 32px;
      padding: 6px 8px;
      text-align: center;
      line-height: 1;
    }

    .sb-toggle {
      font-size: 16px;
      font-weight: bold;
    }

    .sb-btn i,
    .global-btn i {
      pointer-events: none;
    }

    .sb-run i {
      color: #00ffcc;
    }

    /* cambios sin guardar: punto amarillo sobre el icono de guardar */
    .sb-btn.dirty {
      position: relative;
    }

    .sb-btn.dirty::after {
      content: "";
      position: absolute;
      top: 3px;
      right: 3px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffcc00;
    }

    /* pausado (local o global): tono ámbar con icono play */
    .sb-btn.paused,
    #global-bar .global-btn.paused {
      background: rgba(255, 170, 0, 0.25);
      border-color: rgba(255, 170, 0, 0.7);
      color: #ffcc66;
    }

    .sb-del {
      margin-left: auto;
      font-weight: bold;
    }

    .sb-del:hover {
      background: rgba(255, 51, 102, 0.35) !important;
    }

    .only-one .sb-del {
      display: none;
    }

    .sb-resize {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 14px;
      height: 14px;
      cursor: nwse-resize;
      border-right: 2px solid rgba(255, 255, 255, 0.35);
      border-bottom: 2px solid rgba(255, 255, 255, 0.35);
      opacity: 0.9;
    }

    /* --- BARRA GLOBAL (nuevo sandbox, run all, pausa) --- */
    #global-bar {
      position: fixed;
      top: 16px;
      right: 60px;
      z-index: 20;
      display: flex;
      gap: 8px;
    }

    #global-bar .global-btn {
      padding: 8px 12px;
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    #global-bar .global-btn:hover {
      background: rgba(40, 40, 40, 0.9);
    }

    /* --- ESTILOS DE CODEMIRROR SOBREESCRITOS --- */
    .CodeMirror {
      flex: 1;
      width: 100%;
      height: 100%;
      box-sizing: border-box !important;
      max-width: 100%;
      min-width: 0;
      background: transparent !important;
      color: #e8e8e8;
      font: 14px/1.45 Consolas, monospace;
      text-shadow: 0 0 4px black;
      padding: 12px;
    }

    .CodeMirror-wrap pre.CodeMirror-line,
    .CodeMirror-wrap pre.CodeMirror-line-like {
      word-break: break-all !important;
    }

    .CodeMirror-gutters {
      background: transparent !important;
      border-right: none !important;
    }

    .flash-line {
      background-color: rgba(0, 255, 204, 0.4) !important;
      transition: background-color 0.4s ease-out;
    }

    .chain-active-text {
      background-color: rgba(0, 255, 204, 0.3) !important;
      border-radius: 3px;
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
    }

    .color-widget {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 3px;
      margin-right: 4px;
      vertical-align: middle;
      box-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
    }

    #loader {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00ffff;
      font-family: Consolas, monospace;
      font-size: 24px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px 30px;
      border-radius: 8px;
      border: 1px solid #00ffff;
      display: none;
      pointer-events: none;
      z-index: 9999;
    }

    /* --- CAJÓN DE ANIMACIONES BVH --- */
    #bvh-drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(10px);
      color: white;
      z-index: 1000;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      font-family: sans-serif;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 20px;
    }

    #bvh-drawer.abierto {
      transform: translateY(0);
    }

    #drawer-toggle {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 30px;
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: none;
      border-radius: 10px 10px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #aaaaaa;
      transition: all 0.2s;
    }

    #drawer-toggle:hover {
      color: #00ffcc;
      background: rgba(30, 30, 30, 0.9);
    }

    .drawer-header {
      padding: 10px 20px;
      font-size: 14px;
      color: #aaaaaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .drawer-carousel {
      display: flex;
      gap: 15px;
      padding: 10px 20px 10px 20px;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: #555 transparent;
    }

    .bvh-item {
      flex: 0 0 auto;
      width: 160px;
      height: 90px;
      background: #222;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
      user-select: none;
      padding: 10px;
      box-sizing: border-box;
      text-align: center;
    }

    .bvh-item:hover {
      background: #333;
      border-color: #00ffcc;
      transform: scale(1.05);
    }

    .bvh-item span {
      font-size: 14px;
      font-weight: bold;
      pointer-events: none;
      width: 100%;
      overflow-wrap: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* --- SIDEBAR DE AYUDA --- */
    #help-sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: 280px;
      height: 100vh;
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(10px);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      color: #ddd;
      z-index: 1000;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      display: flex;
      flex-direction: column;
      font-family: Consolas, monospace;
    }

    #help-sidebar.abierto {
      transform: translateX(0);
    }

    #help-toggle {
      position: absolute;
      top: 20px;
      left: -40px;
      width: 40px;
      height: 40px;
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-right: none;
      border-radius: 10px 0 0 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #00ffcc;
      font-size: 18px;
      font-weight: bold;
      transition: all 0.2s;
    }

    #help-toggle:hover {
      color: #fff;
      background: rgba(0, 255, 204, 0.2);
    }

    .help-content {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      scrollbar-width: thin;
      scrollbar-color: #555 transparent;
    }

    .help-category {
      color: #aaaaaa;
      font-size: 11px;
      text-transform: uppercase;
      margin-top: 25px;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 5px;
      font-family: sans-serif;
      letter-spacing: 1px;
    }

    .help-category:first-child {
      margin-top: 0;
    }

    .help-item {
      margin-bottom: 14px;
      cursor: pointer;
      transition: transform 0.1s;
      user-select: none;
    }

    .help-item:hover {
      transform: translateX(5px);
    }

    .help-cmd {
      font-weight: bold;
      color: #fff;
      font-size: 13px;
      transition: color 0.2s;
    }

    .help-item:hover .help-cmd {
      color: #00ffcc;
    }

    .help-desc {
      font-size: 11px;
      color: #888;
      display: block;
      margin-top: 3px;
      font-family: sans-serif;
    }

    /* --- SISTEMA DE ERRORES VISUALES (TOAST) --- */
    #error-toast {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(255, 40, 40, 0.9);
      backdrop-filter: blur(5px);
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      border-left: 5px solid #ffaaaa;
      font-family: Consolas, monospace;
      font-size: 13px;
      z-index: 9999;
      max-width: 400px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      transform: translateX(120%);
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      pointer-events: none;
    }

    #error-toast.visible {
      transform: translateX(0);
    }

    #error-toast strong {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <div id="loader">Loading... ⏳</div>

  <div id="app">
    <iframe id="preview" sandbox="allow-scripts allow-same-origin"></iframe>

    <!-- Los sandboxes (editores) se crean desde main.js -->
    <div id="sandboxes"></div>

    <div id="global-bar">
      <button id="addSandboxBtn" class="global-btn" title="Nuevo sandbox"><i class="fas fa-plus"></i> Add
        Sandbox</button>
      <button id="runAllBtn" class="global-btn" title="Ejecutar todos los sandboxes (Ctrl+Shift+Enter)"><i
          class="fas fa-play"></i> Run all</button>
      <button id="globalPauseBtn" class="global-btn" title="Pausar todo (Ctrl+P)"><i class="fas fa-pause"></i></button>
    </div>
  </div>

  <div id="help-sidebar">
    <div id="help-toggle">?</div>
    <div class="help-content">
      <div class="help-category">Creadores (Inicio de bloque)</div>
      <div class="help-item" data-insert='[bvh("dummy")]'><span class="help-cmd">[bvh("dummy")]</span><span
          class="help-desc">Crea un esqueleto en t-pose</span></div>
      <div class="help-category">Modificadores</div>
      <div class="help-item" data-insert='.joints(2)'><span class="help-cmd">.joints(s)</span><span
          class="help-desc">Tamaño de articulaciones</span></div>
      <div class="help-item" data-insert='.bones(2, 1)'><span class="help-cmd">.bones(w, [l])</span><span
          class="help-desc">Grosor y largura de los huesos</span></div>
      <div class="help-item" data-insert='.color("red", "blue")'><span class="help-cmd">.color(c1, [c2])</span><span
          class="help-desc">Color o degradado</span></div>
    </div>
  </div>

  <div id="bvh-drawer">
    <div id="drawer-toggle"><i class="fas fa-chevron-up"></i></div>
    <div class="drawer-header"><span>Animaciones Disponibles</span></div>
    <div class="drawer-carousel" id="bvh-list"></div>
  </div>

  <div id="error-toast">
    <strong>⚠️ Error</strong>
    <span id="error-text"></span>
  </div>

  <script type="module" src="./main.js"></script>

  <script type="module">
    document.addEventListener("DOMContentLoaded", async () => {
      const drawer = document.getElementById('bvh-drawer');
      const toggleBtn = document.getElementById('drawer-toggle');
      const toggleIcon = toggleBtn.querySelector('i');
      const bvhList = document.getElementById('bvh-list');
      const iframePreview = document.getElementById('preview');

      // --- CAJÓN DE ANIMACIONES ---
      toggleBtn.addEventListener('click', () => {
        drawer.classList.toggle('abierto');
        if (drawer.classList.contains('abierto')) {
          toggleIcon.className = 'fas fa-chevron-down';
        } else {
          toggleIcon.className = 'fas fa-chevron-up';
        }
      });

      // --- SIDEBAR DE AYUDA (inserta en el sandbox ACTIVO vía window.editor) ---
      const helpSidebar = document.getElementById('help-sidebar');
      const helpToggle = document.getElementById('help-toggle');
      helpToggle.addEventListener('click', () => {
        helpSidebar.classList.toggle('abierto');
        helpToggle.textContent = helpSidebar.classList.contains('abierto') ? 'X' : '?';
      });

      document.querySelectorAll('.help-item').forEach(item => {
        item.addEventListener('click', () => {
          if (!window.editor) return;
          const insertText = item.getAttribute('data-insert');

          if (insertText.startsWith('[')) {
            let code = window.editor.getValue();
            const regexBusqueda = /\[[^\]]+\]/;

            if (regexBusqueda.test(code)) {
              code = code.replace(regexBusqueda, `${insertText}\n>$&`);
            } else {
              let salto = code.trim() !== "" ? "\n\n" : "";
              code += `${salto}${insertText}`;
            }
            window.editor.setValue(code);

            if (iframePreview.contentWindow && window.runActiveSandbox) window.runActiveSandbox();
            for (let i = 0; i < window.editor.lineCount(); i++) {
              let textoLinea = window.editor.getLine(i);
              let posicion = textoLinea.indexOf(insertText);
              if (posicion !== -1) {
                // Columna = Inicio del texto + (longitud total - 1 para ignorar el ']')
                window.editor.setCursor({ line: i, ch: posicion + insertText.length - 1 });
                break;
              }
            }
          } else {
            window.editor.replaceSelection(insertText);
          }

          window.editor.focus();
        });
      });

      // --- CARGA DE DATOS ---
      let animacionesDisponibles = [];

      try {
        if (typeof require !== 'undefined') {
          const fs = require('fs');
          const path = require('path');
          const rutaAssets = path.join(__dirname, 'assets');
          if (fs.existsSync(rutaAssets)) {
            const archivos = fs.readdirSync(rutaAssets);
            animacionesDisponibles = archivos
              .filter(archivo => archivo.endsWith('.bvh'))
              .map(archivo => archivo.replace('.bvh', ''));
          }
        }
      } catch (e) { console.warn("Local no disponible"); }

      if (animacionesDisponibles.length === 0) {
        try {
          const response = await fetch('./assets/lista.json');
          if (response.ok) {
            animacionesDisponibles = await response.json();
          }
        } catch (e) {
          console.warn("No se pudo leer el lista.json local");
        }
      }

      if (animacionesDisponibles.length === 0 && navigator.onLine) {
        try {
          const urlNube = 'https://cdn.jsdelivr.net/gh/transper-dev/MoveScript@main/assets/lista.json';
          const response = await fetch(urlNube);
          if (response.ok) animacionesDisponibles = await response.json();
        } catch (e) { console.warn("Nube bloqueada temporalmente"); }
      }

      if (animacionesDisponibles.length === 0) {
        console.warn("Cargando animaciones de emergencia.");
        animacionesDisponibles = ["turn", "silly_walk", "monster_walk", "serious_walk"];
      }

      // --- DIBUJAR LOS BOTONES EN LA BANDEJA (insertan en el sandbox ACTIVO) ---
      animacionesDisponibles = animacionesDisponibles.filter(nombre => nombre !== 'dummy');
      animacionesDisponibles.forEach(nombre => {
        const btn = document.createElement('div');
        btn.className = 'bvh-item';
        btn.innerHTML = `<span>${nombre}</span>`;

        btn.addEventListener('click', () => {
          if (!window.editor) return;
          let code = window.editor.getValue();

          const regexBusqueda = /\[[^\]]+\]/;

          if (regexBusqueda.test(code)) {
            code = code.replace(regexBusqueda, `[bvh("${nombre}")]\n>$&`);
          } else {
            let salto = code.trim() !== "" ? "\n\n" : "";
            code += `${salto}[bvh("${nombre}")]`;
          }

          window.editor.setValue(code);
          if (iframePreview.contentWindow && window.runActiveSandbox) window.runActiveSandbox();
        });

        bvhList.appendChild(btn);
      });
    });
  </script>
</body>

</html>
