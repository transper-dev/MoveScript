<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- TODO Seguridad: CDN sin integrity attributes (riesgo: si el CDN es comprometido, se sirve código alterado) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <title>MoveScript</title>
  <link rel="icon" type="image/png" href="./src/icons/icon.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>

  <!-- Modular CSS -->
  <link rel="stylesheet" href="./src/styles/index.css">
</head>

<body>
  <div id="loader">Loading... ⏳</div>

  <div id="app">
    <!-- Sandbox con allow-same-origin necesario para srcdoc + postMessage entre parent e iframe -->
    <iframe id="preview" sandbox="allow-scripts allow-same-origin"></iframe>

    <!-- Los sandboxes (editores) se crean desde main.js -->
    <div id="sandboxes"></div>

    <div id="global-bar">
      <button id="addSandboxBtn" class="global-btn" title="Nueva ventana con un sandbox"><i
          class="fas fa-window-restore"></i><span class="btn-label">New window</span></button>
      <button id="runAllBtn" class="global-btn" title="Ejecutar todos los sandboxes (Ctrl+Shift+Enter)"><i
          class="fas fa-forward"></i><span class="btn-label">Run all</span></button>
      <button id="globalPauseBtn" class="global-btn" title="Pausar todo (Ctrl+P)"><i class="fas fa-pause"></i><span
          class="btn-label">Pause All</span></button>
    </div>
  </div>

  <div id="help-sidebar">
    <div id="help-toggle">?</div>
    <div class="help-content">
      <div class="help-category">Creadores (Inicio de bloque)</div>
      <div class="help-item" data-insert='[bvh("dummy")]'><span class="help-cmd">[bvh("dummy")]</span><span
          class="help-desc">Crea un esqueleto en t-pose</span></div>
      <div class="help-category">Modificadores</div>
      <div class="help-item" data-insert='.joints(2)'><span class="help-cmd">.joints(s)</span><span
          class="help-desc">Tamaño de articulaciones</span></div>
      <div class="help-item" data-insert='.bones(2, 1)'><span class="help-cmd">.bones(w, [l])</span><span
          class="help-desc">Grosor y largura de los huesos</span></div>
      <div class="help-item" data-insert='.color("red", "blue")'><span class="help-cmd">.color(c1, [c2])</span><span
          class="help-desc">Color o degradado</span></div>
    </div>
  </div>

  <div id="bvh-drawer">
    <div id="drawer-toggle"><i class="fas fa-chevron-up"></i></div>
    <div class="drawer-header"><span>Animaciones Disponibles</span></div>
    <div class="drawer-carousel" id="bvh-list"></div>
  </div>

  <div id="error-toast">
    <strong>⚠️ Error</strong>
    <span id="error-text"></span>
  </div>

  <script type="module" src="./src/main.js"></script>
  <script type="module">
    import { initDrawer } from './src/ui/drawer.js';
    import { initHelpSidebar } from './src/ui/helpSidebar.js';
    import { initAnimationList } from './src/ui/animationList.js';

    document.addEventListener("DOMContentLoaded", async () => {
      initDrawer();
      initHelpSidebar();
      await initAnimationList();
    });
  </script>
</body>

</html>
