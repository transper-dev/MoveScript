<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
      }
    }
  </script>
  <script src="/socket.io/socket.io.js"></script>
</head>

<body>
  <canvas id="c" tabindex="1"></canvas>
  <script type="module" src="./bvhApi.js"></script>
  <script>
    const socket = io();

    socket.on('connect', () => {
      console.log('Visor conectado a la centralita local');
    });

    socket.on('execute_code', (data) => {
      const codigoLimpio = (typeof data === 'object') ? data.code : data;

      console.log('Ejecutando codigo:', codigoLimpio);

      window.postMessage({ type: 'execute', code: codigoLimpio }, '*');
    });
  </script>
</body>

</html>
