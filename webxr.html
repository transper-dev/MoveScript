<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MoveScript WebXR</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05070a; }
    canvas { display: block; width: 100%; height: 100%; }
    #overlay {
      position: fixed; top: 16px; left: 16px; z-index: 2; max-width: min(420px, calc(100vw - 32px));
      padding: 14px 16px; border: 1px solid rgba(0, 255, 204, .35); border-radius: 10px;
      background: rgba(5, 10, 14, .82); color: #e9fffa; backdrop-filter: blur(8px);
    }
    #overlay h1 { margin: 0 0 6px; font-size: 16px; color: #00ffcc; }
    #status { margin: 0 0 12px; color: #b8c8c5; font-size: 13px; line-height: 1.35; }
    #enter-vr,
    #overlay .xr-vr-button { position: static !important; width: 100%; box-sizing: border-box; margin: 0; border: 1px solid #00ffcc; border-radius: 7px; padding: 9px 12px; background: #00ffcc; color: #00110d; font-weight: 700; cursor: pointer; }
    #enter-vr:disabled { cursor: not-allowed; opacity: .45; }
    #hint { margin: 10px 0 0; color: #81918e; font-size: 11px; }
  </style>
  <script src="/socket.io/socket.io.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="overlay">
    <h1>MoveScript WebXR</h1>
    <p id="status">Connecting to the desktop tunnel…</p>
    <button id="enter-vr" type="button">Enter immersive VR</button>
    <p id="hint">Open this page from the tunnel URL on the headset.</p>
  </div>
  <script type="module" src="./src/xr/client.js"></script>
</body>
</html>
